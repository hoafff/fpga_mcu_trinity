[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trinity-host"
version = "0.3.8"
description = "FPGA MCU Trinity PC protocol and SN32 hardware qualification CLI"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.scripts]
trinity-host = "trinity_host.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
