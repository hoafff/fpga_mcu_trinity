[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trinity-host"
version = "0.1.0"
description = "FPGA MCU Trinity PC protocol and host common types"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
