name: Primer1 RTL Verification

on:
  push:
    branches: [main]
    paths:
      - 'primer1/rtl/**'
      - 'primer1/tb/**'
      - 'primer1/scripts/**'
      - 'primer1/sources.f'
      - '.github/workflows/primer1-rtl-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rtl-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run Primer1 verification and retain complete log
        id: verify
        shell: bash
        run: |
          set +e
          status=0
          log=primer1_rtl_verification.log
          : > "$log"

          run_check() {
            printf '\n===== %s =====\n' "$1" | tee -a "$log"
            shift
            "$@" 2>&1 | tee -a "$log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ] && [ "$status" -eq 0 ]; then
              status=$rc
            fi
          }

          run_check REFERENCE_CHECKS python3 primer1/scripts/reference_checks.py
          run_check STATIC_CHECKS python3 primer1/scripts/static_check.py
          run_check COMMAND_ARCH_CHECK python3 primer1/scripts/check_command_arch.py
          run_check RTL_SIMULATIONS python3 primer1/tb/run.py
          run_check DIFF_CHECK git diff --check

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "verification_exit_code=$status" | tee -a "$log"
          exit 0

      - name: Write machine-generated evidence report
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          log = Path("primer1_rtl_verification.log").read_text(
              encoding="utf-8", errors="replace"
          )
          exit_code = int(os.environ["VERIFY_EXIT_CODE"])
          status = "PASS" if exit_code == 0 else "FAIL"
          report = f"""# Primer #1 RTL simulation evidence — latest main run

          - Source commit: `{os.environ['GITHUB_SHA']}`
          - Workflow run: `{os.environ['GITHUB_RUN_ID']}`
          - Generated UTC: `{datetime.now(timezone.utc).isoformat()}`
          - Verification status: **{status}**
          - Exit code: `{exit_code}`

          This report is generated by GitHub Actions from the committed Primer #1
          reference checks, static architecture checks and seven RTL testbenches.
          It is not exact-device Gowin synthesis, place-and-route, timing or
          hardware evidence.

          ```text
          {log.rstrip()}
          ```
          """
          Path("primer1/docs").mkdir(parents=True, exist_ok=True)
          Path("primer1/docs/RTL_SIMULATION_LATEST.md").write_text(
              report, encoding="utf-8"
          )
          PY

      - name: Commit evidence to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add primer1/docs/RTL_SIMULATION_LATEST.md
          if git diff --cached --quiet; then
            echo "Evidence report unchanged"
          else
            git commit -m "test(primer1): record RTL simulation evidence [skip ci]"
            git push origin HEAD:main
          fi

      - name: Enforce verification result
        if: always()
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: exit "$VERIFY_EXIT_CODE"
