name: Primer2 One-Shot Regression Recorder

# trigger: 1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/primer2-regression-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install Icarus Verilog
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee /tmp/primer2-regression.log
          sudo apt-get install -y iverilog 2>&1 | tee -a /tmp/primer2-regression.log

      - name: Run complete Primer2 regression
        shell: bash
        run: |
          set +e
          set -o pipefail
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" | tee -a /tmp/primer2-regression.log
          python3 primer2/tb/run.py 2>&1 | tee -a /tmp/primer2-regression.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/primer2-regression-exit-code
          exit "$rc"

      - name: Check diff and protect Primer1
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          git diff --check 36822a09c234f509adfa5dace6aa05e4bbd40d54..HEAD -- primer2 .github/workflows 2>&1 | tee -a /tmp/primer2-regression.log
          ws_rc=${PIPESTATUS[0]}
          git diff --exit-code c8135b5304c0318c7ec24787484dc8a4c4aa0278..HEAD -- \
            primer1/rtl primer1/tb primer1/scripts primer1/constraints \
            primer1/gowin/trinity_primer1.gprj 2>&1 | tee -a /tmp/primer2-regression.log
          p1_rc=${PIPESTATUS[0]}
          if [ "$ws_rc" -ne 0 ] || [ "$p1_rc" -ne 0 ]; then
            echo 1 > /tmp/primer2-regression-guard-failed
            exit 1
          fi

      - name: Publish evidence and remove one-shot workflow
        if: always()
        shell: bash
        run: |
          rc="$(cat /tmp/primer2-regression-exit-code 2>/dev/null || echo 99)"
          guard_rc="$(cat /tmp/primer2-regression-guard-failed 2>/dev/null || echo 0)"
          tested_sha="$(git rev-parse HEAD)"
          if [ "$guard_rc" -ne 0 ]; then rc=98; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p primer2/docs
          {
            echo "Primer #2 RTL regression evidence"
            echo "tested_commit=$tested_sha"
            echo "runner=$RUNNER_OS"
            echo "exit_code=$rc"
            echo
            cat /tmp/primer2-regression.log 2>/dev/null || echo "No regression log was produced."
          } > primer2/docs/CI_RTL_REGRESSION.log
          rm -f .github/workflows/primer2-regression-bootstrap.yml
          git add primer2/docs/CI_RTL_REGRESSION.log .github/workflows/primer2-regression-bootstrap.yml
          git diff --cached --check
          if [ "$rc" -eq 0 ]; then
            git commit -m "test(primer2): record complete RTL regression PASS [skip ci]"
          else
            git commit -m "test(primer2): record complete RTL regression failure [skip ci]"
          fi
          git push origin HEAD:main
