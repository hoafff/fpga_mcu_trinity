name: sn32-full-deploy-source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gate3-mlkem.yml
      - .gitmodules
      - sn32/config/**
      - sn32/docs/FULL_DEPLOY_SOURCE_HANDOFF.md
      - sn32/include/**
      - sn32/src/**
      - sn32/keil/trinity_sn32f407_deploy.uvprojx
      - sn32/third_party/mlkem-native/VENDOR.lock
      - sn32/third_party/mlkem-native/upstream
      - sn32/tests/**
      - pc_host/**
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: sn32-full-deploy-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact ML-KEM submodule pin
        shell: bash
        run: |
          set -euo pipefail
          expected=048fc2a7a7b4ba0ad4c989c1ac82491aa94d5bfa
          actual=$(git -C sn32/third_party/mlkem-native/upstream rev-parse HEAD)
          test "$actual" = "$expected"
          test -f sn32/third_party/mlkem-native/upstream/mlkem/mlkem_native.c
          git submodule status --recursive
      - name: Portable ML-KEM wrapper and KAT gate
        run: |
          make -C sn32/tests/mlkem_gate3 clean test
          make -C sn32/tests/mlkem_gate3 clean
      - name: Full controller behavior gate
        run: |
          make -C sn32/tests/full_controller clean test
          make -C sn32/tests/full_controller clean
      - name: Deploy crypto lifecycle gate
        run: |
          make -C sn32/tests/deploy_crypto clean test
          make -C sn32/tests/deploy_crypto clean
      - name: Protocol and host regressions
        run: |
          make -C sn32/tests/portable clean test
          make -C sn32/tests/portable clean
          PYTHONPATH=pc_host/src python -m unittest discover -s pc_host/tests -v
      - name: Deploy project and repository static gates
        run: |
          python sn32/tests/deploy/check_deploy_project.py
          python sn32/tests/s0/check_s0_project.py
          python ai_context/scripts/check_repository_layout.py
          python ai_context/scripts/check_project_memory_detail.py
          python ai_context/scripts/check_protocol_registry.py
          python ai_context/scripts/check_candidate_hashes.py
      - name: Whitespace and submodule cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Publish source-gate commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success)
              export STATUS_STATE=success
              export STATUS_DESCRIPTION="SN32 full deploy source gates passed"
              ;;
            cancelled)
              export STATUS_STATE=error
              export STATUS_DESCRIPTION="SN32 full deploy source gates cancelled"
              ;;
            *)
              export STATUS_STATE=failure
              export STATUS_DESCRIPTION="SN32 full deploy source gates failed"
              ;;
          esac
          python - <<'PY'
          import json, os
          payload = {
              "state": os.environ["STATUS_STATE"],
              "context": "sn32-full-deploy-source",
              "description": os.environ["STATUS_DESCRIPTION"],
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          with open("/tmp/status.json", "w", encoding="utf-8") as out:
              json.dump(payload, out)
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/status.json
