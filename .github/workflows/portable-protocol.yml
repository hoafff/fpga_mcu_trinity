name: portable-protocol

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repository and project-memory checks
        run: |
          python ai_context/scripts/check_repository_layout.py
          python ai_context/scripts/check_project_memory_detail.py
          python ai_context/scripts/check_protocol_registry.py
          python ai_context/scripts/check_candidate_hashes.py
      - name: Python protocol tests
        env:
          PYTHONPATH: pc_host/src
        run: python -m unittest discover -s pc_host/tests -v
      - name: Portable C protocol tests
        run: make -C sn32/tests/portable test

  primer2-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run Primer2 reference, static and eight-bench RTL regression
        run: python primer2/tb/run.py
      - name: Check Primer2 diff whitespace
        run: |
          git diff --check 36822a09c234f509adfa5dace6aa05e4bbd40d54..HEAD -- \
            primer2 .github/workflows/portable-protocol.yml \
            .github/workflows/primer2-rtl-verification.yml
      - name: Guard qualified Primer1 implementation
        run: |
          git diff --exit-code c8135b5304c0318c7ec24787484dc8a4c4aa0278..HEAD -- \
            primer1/rtl primer1/tb primer1/scripts primer1/constraints \
            primer1/gowin/trinity_primer1.gprj
