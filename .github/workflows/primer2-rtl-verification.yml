name: Primer2 RTL Verification

on:
  push:
    branches: [main]
    paths:
      - 'primer2/rtl/**'
      - 'primer2/tb/**'
      - 'primer2/scripts/**'
      - 'primer2/sources.f'
      - 'primer2/constraints/**'
      - 'primer2/gowin/**'
      - '.github/workflows/primer2-rtl-verification.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  rtl-simulation:
    if: github.event_name != 'issues' || github.event.issue.title == 'internal-primer2-rtl-verify-badtag-8d34e5f2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install Icarus Verilog
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee /tmp/primer2-rtl-regression.log
          sudo apt-get install -y iverilog 2>&1 | tee -a /tmp/primer2-rtl-regression.log

      - name: Run Primer2 reference, static and RTL regression
        id: regression
        shell: bash
        run: |
          set +e
          set -o pipefail
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" | tee -a /tmp/primer2-rtl-regression.log
          python3 primer2/tb/run.py 2>&1 | tee -a /tmp/primer2-rtl-regression.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/primer2-rtl-exit-code
          exit "$rc"

      - name: Check Primer2 diff whitespace
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          git diff --check 36822a09c234f509adfa5dace6aa05e4bbd40d54..HEAD -- primer2 .github/workflows/primer2-rtl-verification.yml 2>&1 | tee -a /tmp/primer2-rtl-regression.log
          rc=${PIPESTATUS[0]}
          test "$rc" -eq 0

      - name: Guard qualified Primer1 implementation
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          git diff --exit-code c8135b5304c0318c7ec24787484dc8a4c4aa0278..HEAD -- \
            primer1/rtl primer1/tb primer1/scripts primer1/constraints \
            primer1/gowin/trinity_primer1.gprj 2>&1 | tee -a /tmp/primer2-rtl-regression.log
          rc=${PIPESTATUS[0]}
          test "$rc" -eq 0

      - name: Publish regression evidence
        if: always()
        shell: bash
        run: |
          rc="$(cat /tmp/primer2-rtl-exit-code 2>/dev/null || echo 99)"
          tested_sha="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p primer2/docs
          {
            echo "Primer #2 RTL regression evidence"
            echo "tested_commit=$tested_sha"
            echo "runner=$RUNNER_OS"
            echo "exit_code=$rc"
            echo
            cat /tmp/primer2-rtl-regression.log
          } > primer2/docs/CI_RTL_REGRESSION.log
          git add primer2/docs/CI_RTL_REGRESSION.log
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "$rc" -eq 0 ]; then
            git commit -m "test(primer2): record RTL regression PASS [skip ci]"
          else
            git commit -m "test(primer2): record RTL regression failure [skip ci]"
          fi
          git push origin HEAD:main
