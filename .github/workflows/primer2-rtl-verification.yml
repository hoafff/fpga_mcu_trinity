name: Primer2 RTL Verification

on:
  push:
    branches: [main]
    paths:
      - 'primer2/rtl/**'
      - 'primer2/tb/**'
      - 'primer2/scripts/**'
      - 'primer2/sources.f'
      - 'primer2/constraints/**'
      - 'primer2/gowin/**'
      - '.github/workflows/primer2-rtl-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rtl-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run Primer2 verification and retain complete log
        id: verify
        shell: bash
        run: |
          set +e
          status=0
          log=primer2_rtl_verification.log
          : > "$log"

          run_check() {
            printf '\n===== %s =====\n' "$1" | tee -a "$log"
            shift
            "$@" 2>&1 | tee -a "$log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ] && [ "$status" -eq 0 ]; then
              status=$rc
            fi
          }

          run_check REFERENCE_STATIC_AND_RTL python3 primer2/tb/run.py
          run_check DIFF_CHECK git diff --check \
            36822a09c234f509adfa5dace6aa05e4bbd40d54..HEAD -- \
            primer2 \
            ':(exclude)primer2/docs/RTL_SIMULATION_LATEST.md' \
            ':(exclude)primer2/docs/TESTBENCH_PORTABILITY_MIGRATION_LATEST.md' \
            .github/workflows/primer2-rtl-verification.yml
          run_check P1_GUARD git diff --exit-code \
            e52488614c5610f2b3f5ffcd77b1a98b370494bc..HEAD -- \
            primer1/rtl primer1/tb primer1/scripts primer1/constraints \
            primer1/gowin/trinity_primer1.gprj

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "verification_exit_code=$status" | tee -a "$log"
          exit 0

      - name: Write machine-generated evidence report
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          log = Path("primer2_rtl_verification.log").read_text(
              encoding="utf-8", errors="replace"
          )
          clean_log = "\n".join(
              line.rstrip() for line in log.rstrip().splitlines()
          )
          exit_code = int(os.environ["VERIFY_EXIT_CODE"])
          status = "PASS" if exit_code == 0 else "FAIL"
          report = f"""# Primer #2 RTL simulation evidence — latest main run

          - Source commit: `{os.environ['GITHUB_SHA']}`
          - Workflow run: `{os.environ['GITHUB_RUN_ID']}`
          - Generated UTC: `{datetime.now(timezone.utc).isoformat()}`
          - Verification status: **{status}**
          - Exit code: `{exit_code}`

          This report is generated by GitHub Actions from the committed Primer #2
          reference checks, static checks, RTL regression, diff check and corrected
          Primer #1 source guard. It is not exact-device Gowin synthesis,
          place-and-route, timing or hardware evidence.

          ```text
          {clean_log}
          ```
          """
          report = "\n".join(line.rstrip() for line in report.splitlines()) + "\n"
          Path("primer2/docs").mkdir(parents=True, exist_ok=True)
          Path("primer2/docs/RTL_SIMULATION_LATEST.md").write_text(
              report, encoding="utf-8"
          )
          PY

      - name: Commit evidence to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add primer2/docs/RTL_SIMULATION_LATEST.md
          if git diff --cached --quiet; then
            echo "Evidence report unchanged"
          else
            git commit -m "test(primer2): record RTL simulation evidence [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce verification result
        if: always()
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: exit "$VERIFY_EXIT_CODE"
