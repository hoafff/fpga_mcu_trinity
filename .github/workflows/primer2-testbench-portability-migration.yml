name: Primer2 testbench portability migration

on:
  push:
    paths:
      - .github/workflows/primer2-testbench-portability-migration.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Correct portable testbench constructs
        shell: python
        run: |
          from pathlib import Path
          import re

          def require_sub(path: Path, pattern: str, replacement: str,
                          expected: int = 1, flags: int = 0) -> None:
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, flags=flags)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} replacements, got {count}"
                  )
              path.write_text(updated, encoding="utf-8")

          require_sub(
              Path("primer2/tb/tb_bad_tag_threshold.sv"),
              r"input logic \[63:0\] sequence,",
              "input logic [63:0] sequence_value,",
          )
          require_sub(
              Path("primer2/tb/tb_bad_tag_threshold.sv"),
              r"payload\[8\*\(4\+i\) \+: 8\] = sequence\[63-8\*i -: 8\];",
              "payload[8*(4+i) +: 8] = sequence_value[63-8*i -: 8];",
          )
          require_sub(
              Path("primer2/tb/tb_reset_states.sv"),
              r"task automatic poison_and_reset\(input integer case_id\);",
              "task poison_and_reset(input integer case_id);",
          )

          fault_path = Path("primer2/tb/tb_fault_output.sv")
          require_sub(
              fault_path,
              r"  task automatic expect_known_fault\(.*?^  endtask",
              """  task automatic expect_known_fault(input logic expected_value);
                begin
                  #1;
                  if ($isunknown(fault_o))
                    $fatal(1, \"fault_o is unknown\");
                  if (fault_o !== expected_value)
                    $fatal(1, \"fault_o=%b expected=%b\", fault_o, expected_value);
                end
              endtask""",
              flags=re.MULTILINE | re.DOTALL,
          )
          require_sub(
              fault_path,
              r"expect_known_fault\((1'b[01]),\s*\"[^\"]+\"\);",
              r"expect_known_fault(\1);",
              expected=7,
          )

          require_sub(
              Path("primer2/tb/tb_uart_rx_byte.sv"),
              r"    fork send_byte\(8'h33,1\);.*?"
              r"repeat\(5\)@\(posedge clk\); if\(busy\)"
              r"\$fatal\(1,\"abort left UART busy\"\);",
              """    @(negedge clk); rx=0;
                repeat(15)@(posedge clk);
                @(negedge clk); abort=1; rx=1;
                @(posedge clk);
                @(negedge clk); abort=0;
                repeat(5)@(posedge clk); if(busy)$fatal(1,\"abort left UART busy\");""",
              flags=re.DOTALL,
          )

          require_sub(
              Path("primer2/tb/tb_primer2_top.sv"),
              r"    fatal=1;repeat\(4\)@\(posedge clk\);fatal=0;cycles=0;\n"
              r"    while\(!fault&&cycles<80\)begin @\(posedge clk\);cycles=cycles\+1;end\n"
              r"    if\(!fault\|\|dut\.session_state!=4'd8\)"
              r"\$fatal\(1,\"fatal did not enter fault locked\"\);",
              """    @(negedge clk);fatal=1;repeat(6)@(posedge clk);@(negedge clk);fatal=0;cycles=0;
                while((!fault||dut.session_state!=4'd8)&&cycles<100)begin @(posedge clk);cycles=cycles+1;end
                if(!fault||dut.session_state!=4'd8)$fatal(1,\"fatal did not enter fault locked\");""",
          )

      - name: Run complete Primer2 regression
        id: regression
        shell: bash
        run: |
          set +e
          python3 primer2/tb/run.py > primer2_portability_migration.log 2>&1
          rc=$?
          cat primer2_portability_migration.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write migration evidence
        shell: python
        env:
          EXIT_CODE: ${{ steps.regression.outputs.exit_code }}
        run: |
          from datetime import datetime, timezone
          from pathlib import Path
          import os

          code = int(os.environ["EXIT_CODE"])
          status = "PASS" if code == 0 else "FAIL"
          log = Path("primer2_portability_migration.log").read_text(
              encoding="utf-8", errors="replace"
          )
          report = f"""# Primer #2 testbench portability migration

          - Trigger commit: `{os.environ['GITHUB_SHA']}`
          - Workflow run: `{os.environ['GITHUB_RUN_ID']}`
          - Generated UTC: `{datetime.now(timezone.utc).isoformat()}`
          - Result: **{status}**
          - Exit code: `{code}`

          The candidate changes affect testbench syntax and race-free stimulus
          only. RTL implementation files are unchanged by this migration.

          ```text
          {log.rstrip()}
          ```
          """
          Path("primer2/docs/TESTBENCH_PORTABILITY_MIGRATION_LATEST.md").write_text(
              report, encoding="utf-8"
          )

      - name: Commit verified fixes or failure evidence
        shell: bash
        env:
          EXIT_CODE: ${{ steps.regression.outputs.exit_code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$EXIT_CODE" -eq 0 ]; then
            rm .github/workflows/primer2-testbench-portability-migration.yml
            git add -A
            message="test(primer2): make RTL regression Icarus-portable"
          else
            git restore primer2/tb
            git add primer2/docs/TESTBENCH_PORTABILITY_MIGRATION_LATEST.md
            message="test(primer2): record portability migration failure [skip ci]"
          fi
          git diff --check --cached
          git commit -m "$message"
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$EXIT_CODE"
