name: Primer2 evidence whitespace migration

on:
  push:
    paths:
      - .github/workflows/primer2-evidence-whitespace-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make evidence generation whitespace-clean
        shell: python
        run: |
          from pathlib import Path

          report = Path("primer2/docs/RTL_SIMULATION_LATEST.md")
          text = report.read_text(encoding="utf-8")
          text = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
          report.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/primer2-rtl-verification.yml")
          text = workflow.read_text(encoding="utf-8")
          old = '''          log = Path("primer2_rtl_verification.log").read_text(
              encoding="utf-8", errors="replace"
          )
          exit_code = int(os.environ["VERIFY_EXIT_CODE"])'''
          new = '''          log = Path("primer2_rtl_verification.log").read_text(
              encoding="utf-8", errors="replace"
          )
          clean_log = "\\n".join(
              line.rstrip() for line in log.rstrip().splitlines()
          )
          exit_code = int(os.environ["VERIFY_EXIT_CODE"])'''
          if text.count(old) != 1:
              raise SystemExit("verification log reader did not match")
          text = text.replace(old, new)
          old = "          {log.rstrip()}"
          new = "          {clean_log}"
          if text.count(old) != 1:
              raise SystemExit("verification report log interpolation did not match")
          text = text.replace(old, new)
          workflow.write_text(text, encoding="utf-8")
      - name: Validate and commit
        run: |
          rm .github/workflows/primer2-evidence-whitespace-migration.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci(primer2): keep RTL evidence whitespace-clean"
          git pull --rebase origin main
          git push origin HEAD:main
